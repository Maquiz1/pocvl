{% extends 'base.html' %}

{% block title %}Logbook - Add Recipient{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="h3 mb-4">Add Recipient</h1>

    <form method="post" class="card p-4 shadow-sm">
        {% csrf_token %}

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="type" class="form-label">Type</label>
            <select id="type" name="type" class="form-select">
                <option value="cc">CC</option>
                <option value="bcc">BCC</option>
            </select>
        </div>

        <div class="form-check mb-3">
            <input type="checkbox" id="is_active" name="is_active" class="form-check-input" checked>
            <label for="is_active" class="form-check-label">Active</label>
        </div>

        <div class="d-flex justify-content-between">
            <a href="{% url 'utils:email_recipient_list' %}" class="btn btn-secondary">
                Cancel
            </a>
            <button type="submit" class="btn btn-primary">
                Save Recipient
            </button>
        </div>
    </form>
</div>
{% endblock %}
