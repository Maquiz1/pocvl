{% extends 'base.html' %}

{% block title %}Logbook - Edit Recipient{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="h3 mb-4">Edit Recipient</h1>

    <form method="post" class="card p-4 shadow-sm">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="d-flex justify-content-between mt-3">
            <a href="{% url 'utils:email_recipient_list' %}" class="btn btn-secondary">
                Cancel
            </a>
            <button type="submit" class="btn btn-primary">
                Save Changes
            </button>
        </div>
    </form>
</div>
{% endblock %}
