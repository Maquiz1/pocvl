{% extends 'base.html' %}
{% block title %}Logbook - Add Site Configuration{% endblock %}
{% block content %}
<div class="container mt-4">
    <h1 class="h3 mb-4">Add Site Configuration</h1>
    <form method="post" class="card p-4 shadow-sm">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex justify-content-between mt-3">
            <a href="{% url 'utils:site_configuration_list' %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save</button>
        </div>
    </form>
</div>
{% endblock %}
