{% extends "base.html" %}

{% block content %}

<div class="container">

    <h3>

        {% if is_update %}
        Edit CRF6
        {% else %}
        Create CRF6
        {% endif %}

        — Subject {{ enrollment.screening.subject.subject_id }}

    </h3>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-success">
            Save
        </button>

        <a href="{% url 'herbal:subjects-detail' enrollment.screening.subject.pk %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
