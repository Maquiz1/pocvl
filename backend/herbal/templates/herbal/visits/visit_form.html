<!-- herbal/templates/herbal/visits/visit_start_form.html -->

{% extends "base.html" %}

{% block content %}

<div class="container">

    <h4> {% if is_edit %}
        Edit Visit Date
        {% else %}
        Start Visit
        {% endif %}
    </h4>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Actual Visit Date</label>
            {{ form.actual_visit_date }}
        </div>

        <button type="submit" class="btn btn-success">
            Start Visit
        </button>

        <a href="{% url 'herbal:subjects-detail' visit.subject.pk %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>

</div>

{% endblock %}
