<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f6f8fa;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            max-width: 600px;
            margin: auto;
            border: 1px solid #e0e0e0;
        }
        .header {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        .field {
            margin-bottom: 10px;
        }
        .label {
            font-weight: bold;
            color: #555;
        }
        .value {
            color: #000;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 4px;
            background-color: #3498db;
            color: white;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        Visit Reminder
    </div>

    <div class="field">
        <span class="label">Patient ID:</span>
        <span class="value">{{ subject_id }}</span>
    </div>

    <div class="field">
        <span class="label">Visit:</span>
        <span class="value">{{ visit_name }}</span>
    </div>

    <div class="field">
        <span class="label">Scheduled Date:</span>
        <span class="value">{{ scheduled_date }}</span>
    </div>

    <div class="field">
        <span class="label">Site:</span>
        <span class="value">{{ site_name }}</span>
    </div>

    <div class="field">
        <span class="label">Reminder:</span>
        <span class="badge">{{ reminder_type }}</span>
    </div>

    <div class="footer">
        Please follow up accordingly.<br>
        This is an automated message.
    </div>
</div>

</body>
</html>
